<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">AgentDesk Native：多个账号，一个面板</title>
<desc id="desc">产品界面示意，包含 Claude 和 Codex 账号、额度与任务。所有账号、任务和额度均为演示数据。</desc>
<defs>
  <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#f6f7fb"/><stop offset="1" stop-color="#e7eaf2"/></linearGradient>
  <linearGradient id="glass" x2=".4" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset="1" stop-color="#f4f5f9" stop-opacity=".93"/></linearGradient>
  <filter id="shadow" x="-.3" y="-.2" width="1.6" height="1.5"><feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#303c5b" flood-opacity=".14"/></filter>
  <g id="check"><circle r="9" fill="none" stroke="#28734b" stroke-width="1.6"/><path d="m-4 0 3 3 5-7" fill="none" stroke="#28734b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
</defs>
<rect width="1280" height="800" rx="28" fill="url(#canvas)"/>
<circle cx="1060" cy="680" r="240" fill="#c4cfe9" opacity=".24"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
  <g transform="translate(80 70) scale(.112)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="#e8ebef"/>
    <g fill="none" stroke="#475363" stroke-width="40" stroke-linejoin="round" stroke-linecap="round"><path d="M280 390 512 260 744 390 512 520 Z" fill="#f8fafc"/><path d="M280 510 512 640 744 510 M280 630 512 760 744 630"/></g>
  </g>
  <text x="218" y="139" font-size="40" font-weight="650" fill="#202938">AgentDesk Native</text>
  <text x="90" y="279" font-size="49" font-weight="650" letter-spacing="-1.5" fill="#202938">多个账号，一个面板。</text>
  <text x="93" y="330" font-size="21" fill="#556071">在菜单栏或系统托盘查看 Codex 与 Claude，</text>
  <text x="93" y="365" font-size="21" fill="#556071">切换账号，跟进任务，掌握额度。</text>
  <g fill="#273446" font-size="20">
    <text x="94" y="462">01</text><text x="145" y="462">账号与最近会话集中查看</text>
    <text x="94" y="512">02</text><text x="145" y="512">实时额度与重置时间</text>
    <text x="94" y="562">03</text><text x="145" y="562">Markdown 文档接力</text>
  </g>
  <rect x="92" y="628" width="244" height="44" rx="22" fill="#fff" fill-opacity=".75"/>
  <text x="214" y="656" text-anchor="middle" font-size="17" fill="#455267">macOS 14+ · Windows 10+</text>
  <text x="94" y="736" font-size="15" fill="#697486">可选原生浮球。默认保持系统原生外观。</text>
  <g transform="translate(786 62)">
    <rect width="406" height="676" rx="22" fill="url(#glass)" stroke="#fff" filter="url(#shadow)"/>
    <g transform="translate(20 20)">
      <text y="25" font-size="20" font-weight="650" fill="#252c37">AgentDesk Native</text>
      <rect x="1" y="53" width="24" height="24" rx="6" fill="#d97553"/>
      <text x="13" y="72" text-anchor="middle" fill="#fff" font-size="22">✳</text>
      <text x="37" y="72" font-size="17" font-weight="600" fill="#252c37">Claude</text><text x="350" y="72" font-size="20" fill="#69717c">⌄</text>
      <rect y="91" width="366" height="222" rx="13" fill="#202938" fill-opacity=".045"/>
      <g transform="translate(14 91)" font-size="16" fill="#252c37">
        <text y="30" font-size="18" font-weight="600">工作账号</text><circle cx="86" cy="24" r="4" fill="#28734b"/>
        <text x="266" y="29" fill="#67707d">⟳</text><rect x="289" y="10" width="49" height="27" rx="6" fill="#202938" fill-opacity=".08"/><text x="313" y="29" text-anchor="middle" font-size="15">前台</text>
        <g font-size="15"><text y="62" fill="#596371">5h</text><text x="32" y="62">28%</text><text x="338" y="62" text-anchor="end" fill="#596371">2小时10分后重置</text>
        <text y="87" fill="#596371">周</text><text x="32" y="87">64%</text><text x="338" y="87" text-anchor="end" fill="#596371">3天后重置</text></g>
        <circle cx="10" cy="118" r="9" fill="none" stroke="#426c9b" stroke-width="1.6"/><circle cx="10" cy="118" r="3" fill="#426c9b"/>
        <text x="29" y="124">完善产品页面</text><text x="338" y="124" text-anchor="end" font-size="14">运行中</text>
        <use href="#check" x="10" y="152"/><text x="29" y="158">整理设计说明</text><text x="338" y="158" text-anchor="end" font-size="14">已完成</text>
        <use href="#check" x="10" y="186"/><text x="29" y="192">检查发布文档</text><text x="338" y="192" text-anchor="end" font-size="14">已完成</text>
      </g>
      <rect x="1" y="332" width="24" height="24" rx="6" fill="#fff" stroke="#d2d6dd"/><text x="13" y="350" text-anchor="middle" fill="#252c37" font-size="17">◎</text>
      <text x="37" y="351" font-size="17" font-weight="600" fill="#252c37">Codex</text><text x="350" y="351" font-size="20" fill="#69717c">⌄</text>
      <rect y="370" width="366" height="190" rx="13" fill="#202938" fill-opacity=".045"/>
      <g transform="translate(14 370)" font-size="16" fill="#252c37">
        <text y="30" font-size="18" font-weight="600">开发账号</text><circle cx="86" cy="24" r="4" fill="#28734b"/>
        <text x="266" y="29" fill="#67707d">⟳</text><rect x="289" y="10" width="49" height="27" rx="6" fill="#202938" fill-opacity=".08"/><text x="313" y="29" text-anchor="middle" font-size="15">前台</text>
        <text y="63" font-size="15" fill="#596371">周</text><text x="32" y="63" font-size="15">42%</text><text x="338" y="63" text-anchor="end" font-size="15" fill="#596371">周三 14:55 重置</text>
        <use href="#check" x="10" y="98"/><text x="29" y="104">实现面板交互</text><text x="338" y="104" text-anchor="end" font-size="14">已完成</text>
        <use href="#check" x="10" y="132"/><text x="29" y="138">验证构建结果</text><text x="338" y="138" text-anchor="end" font-size="14">已完成</text>
        <text y="173" font-size="15" fill="#596371">更多</text>
      </g>
      <path d="M0 589 H366" stroke="#d4d9e1"/>
      <text y="621" font-size="17" fill="#66707d">＋ 新建账号</text><text x="303" y="621" font-size="23" fill="#66707d">ⓘ</text><text x="344" y="621" font-size="23" fill="#66707d">⚙</text>
    </g>
  </g>
  <text x="988" y="773" text-anchor="middle" font-size="13" fill="#697486">界面示意 · 账号、任务与额度为演示数据</text>
</g>
</svg>
