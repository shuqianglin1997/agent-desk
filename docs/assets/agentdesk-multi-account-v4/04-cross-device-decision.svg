<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">跨设备接续时选择位置、内容、迁移或远程控制的判断图</title>
  <desc id="desc">先判断是否依赖来源环境，再确认目标项目，最后决定只发送位置、明确发送内容或使用受支持的会话包迁移。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#151515}
    .title{font-size:28px;font-weight:600}.sub{font-size:16px}.head{font-size:18px;font-weight:600}.body{font-size:15px}.small{font-size:13px;fill:#4b4b4b}
    .start{fill:#222;stroke:#222;stroke-width:1.5}.startText{font-size:16px;fill:#fff;font-weight:600}.q{fill:#f3f3f3;stroke:#222;stroke-width:1.7}.box{fill:#fff;stroke:#222;stroke-width:1.5}.out{fill:#fff;stroke:#222;stroke-width:2}
    .line{fill:none;stroke:#222;stroke-width:1.7;marker-end:url(#arrow)}.dash{fill:none;stroke:#666;stroke-width:1.4;stroke-dasharray:6 5;marker-end:url(#arrow)}
  </style>
  <rect width="1200" height="790" fill="#fff"/>
  <text class="title" x="48" y="52">跨设备接续要依次解决环境、项目和会话内容</text>
  <text class="sub" x="48" y="82">系统不会从会话里猜需要哪些文件，也不会把“发送位置”写成“已经迁移会话”。</text>

  <rect class="start" x="470" y="112" width="260" height="54" rx="27"/>
  <text class="startText" x="600" y="146" text-anchor="middle">已选来源会话和目标账号</text>

  <rect class="q" x="444" y="208" width="312" height="70" rx="10"/>
  <text class="head" x="600" y="238" text-anchor="middle">工作是否依赖来源电脑环境？</text>
  <text class="small" x="600" y="260" text-anchor="middle">登录、未提交修改、硬件或专用软件</text>
  <path class="line" d="M600 166V200"/>

  <rect class="out" x="840" y="210" width="280" height="66" rx="10"/>
  <text class="head" x="980" y="239" text-anchor="middle">远程操作来源电脑</text>
  <text class="small" x="980" y="260" text-anchor="middle">工作继续发生在原环境</text>
  <path class="line" d="M756 243H832"/><text class="small" x="790" y="230">是</text>

  <rect class="q" x="444" y="330" width="312" height="70" rx="10"/>
  <text class="head" x="600" y="360" text-anchor="middle">目标电脑是否已有同一项目？</text>
  <text class="small" x="600" y="382" text-anchor="middle">使用目标电脑自己的本地目录</text>
  <path class="line" d="M600 278V322"/><text class="small" x="615" y="308">否</text>

  <rect class="box" x="76" y="332" width="288" height="66" rx="10"/>
  <text class="head" x="220" y="361" text-anchor="middle">先建立目标工作区</text>
  <text class="small" x="220" y="382" text-anchor="middle">克隆仓库或由目标端选择项目根目录</text>
  <path class="line" d="M444 365H372"/><text class="small" x="402" y="352">没有</text>
  <path class="dash" d="M220 398V430H420V365H436"/>

  <rect class="q" x="444" y="452" width="312" height="70" rx="10"/>
  <text class="head" x="600" y="482" text-anchor="middle">目标项目版本是否适合继续？</text>
  <text class="small" x="600" y="504" text-anchor="middle">分支、提交和本地修改由人确认</text>
  <path class="line" d="M600 400V444"/>

  <rect class="box" x="76" y="442" width="288" height="92" rx="10"/>
  <text class="head" x="220" y="470" text-anchor="middle">选择一种处理</text>
  <text class="small" x="220" y="494" text-anchor="middle">更新目标项目 · 发送明确文件</text>
  <text class="small" x="220" y="516" text-anchor="middle">或改为远程操作来源电脑</text>
  <path class="line" d="M444 487H372"/><text class="small" x="402" y="474">不适合</text>

  <rect class="q" x="444" y="574" width="312" height="70" rx="10"/>
  <text class="head" x="600" y="604" text-anchor="middle">目标账号需要哪种会话信息？</text>
  <text class="small" x="600" y="626" text-anchor="middle">这一选择决定传输内容</text>
  <path class="line" d="M600 522V566"/><text class="small" x="615" y="552">适合</text>

  <rect class="out" x="48" y="690" width="322" height="72" rx="10"/>
  <text class="head" x="209" y="719" text-anchor="middle">只发送会话位置</text>
  <text class="small" x="209" y="742" text-anchor="middle">会话位置包；不包含对话正文</text>
  <rect class="out" x="439" y="690" width="322" height="72" rx="10"/>
  <text class="head" x="600" y="719" text-anchor="middle">明确发送只读会话内容</text>
  <text class="small" x="600" y="742" text-anchor="middle">供新会话 B 阅读；B 单独成行</text>
  <rect class="out" x="830" y="690" width="322" height="72" rx="10"/>
  <text class="head" x="991" y="719" text-anchor="middle">迁移受支持的会话包</text>
  <text class="small" x="991" y="742" text-anchor="middle">适配器验证、可回滚、保留来源</text>
  <path class="line" d="M540 644V666H209V682"/>
  <path class="line" d="M600 644V682"/>
  <path class="line" d="M660 644V666H991V682"/>
</svg>
