<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">AgentDesk 主窗口与远程控制窗口的信息位置示意</title>
  <desc id="desc">主窗口保留七行布局，设备筛选、Agent、运行位置、额度和会话操作位于固定区域；远程控制在独立窗口中。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#151515}
    .title{font-size:28px;font-weight:600}.sub{font-size:16px}.head{font-size:17px;font-weight:600}.body{font-size:14px}.small{font-size:12px;fill:#4b4b4b}.white{fill:#fff}
    .window{fill:#fff;stroke:#171717;stroke-width:2}.row{fill:#f7f7f7;stroke:#999;stroke-width:1}.control{fill:#fff;stroke:#333;stroke-width:1.2}.primary{fill:#222;stroke:#222}.primaryText{fill:#fff;font-size:13px;font-weight:600}.note{fill:#fff;stroke:#555;stroke-width:1.2}.dash{stroke:#666;stroke-width:1.3;stroke-dasharray:6 5;fill:none}
  </style>
  <rect width="1200" height="800" fill="#fff"/>
  <text class="title" x="42" y="50">设备是查看条件，运行位置是动作落点，远程控制另开窗口</text>
  <text class="sub" x="42" y="78">示意图只说明信息位置和主次关系，不改变现有主窗口的七行骨架。</text>

  <rect class="window" x="42" y="108" width="786" height="634" rx="12"/>
  <rect x="42" y="108" width="786" height="38" rx="12" fill="#222"/>
  <circle cx="65" cy="127" r="5" fill="#fff"/><circle cx="83" cy="127" r="5" fill="#fff"/><circle cx="101" cy="127" r="5" fill="#fff"/>
  <text class="white" x="435" y="132" font-family="sans-serif" font-size="13" text-anchor="middle">AgentDesk 主窗口</text>

  <rect class="row" x="58" y="158" width="754" height="54" rx="6"/>
  <text class="head" x="76" y="182">1 顶栏</text>
  <rect class="control" x="242" y="169" width="160" height="30" rx="6"/>
  <text class="body" x="322" y="189" text-anchor="middle">设备：全部设备 ▾</text>
  <text class="small" x="650" y="189">设备 · 工具 · 帮助</text>

  <rect class="row" x="58" y="220" width="754" height="106" rx="6"/>
  <text class="head" x="76" y="246">2 Agent 展示区</text>
  <rect class="control" x="242" y="238" width="164" height="70" rx="8"/>
  <text class="body" x="324" y="264" text-anchor="middle">开发助手</text>
  <text class="small" x="324" y="286" text-anchor="middle">3 个位置 · 2 在线</text>
  <rect class="control" x="426" y="238" width="164" height="70" rx="8"/>
  <text class="body" x="508" y="264" text-anchor="middle">写作助手</text>
  <text class="small" x="508" y="286" text-anchor="middle">1 个位置 · 在线</text>
  <text class="small" x="612" y="274">同一 Agent 不按设备重复</text>

  <rect class="row" x="58" y="334" width="754" height="64" rx="6"/>
  <text class="head" x="76" y="360">3 Agent 控制条</text>
  <rect class="control" x="242" y="346" width="330" height="36" rx="6"/>
  <text class="small" x="407" y="369" text-anchor="middle">Codex 备用账号 — Mac Studio / 桌面客户端 ▾</text>
  <text class="small" x="590" y="369">选择明确运行位置</text>

  <rect class="row" x="58" y="406" width="754" height="46" rx="6"/>
  <text class="head" x="76" y="434">4 关注提示</text>
  <text class="small" x="242" y="434">项目版本不同 · 目标设备离线 · 权限待确认</text>

  <rect class="row" x="58" y="460" width="754" height="62" rx="6"/>
  <text class="head" x="76" y="487">5 额度</text>
  <text class="body" x="242" y="487">主账号：已耗尽</text>
  <text class="body" x="410" y="487">备用账号：可用</text>
  <text class="small" x="242" y="508">按实际账号去重，并标明来源和更新时间</text>

  <rect class="row" x="58" y="530" width="754" height="158" rx="6"/>
  <text class="head" x="76" y="556">6 会话列表与详情</text>
  <rect class="control" x="242" y="544" width="250" height="30" rx="6"/>
  <text class="small" x="367" y="564" text-anchor="middle">范围：当前 Agent / 全部 Agent</text>
  <line x1="242" y1="594" x2="782" y2="594" stroke="#aaa"/>
  <text class="small" x="252" y="616">修复会话列表重复问题</text>
  <text class="small" x="592" y="616">来源：MacBook</text>
  <rect class="primary" x="242" y="638" width="168" height="34" rx="6"/>
  <text class="primaryText" x="326" y="660" text-anchor="middle">复制会话信息</text>
  <rect class="control" x="422" y="638" width="142" height="34" rx="6"/>
  <text class="body" x="493" y="660" text-anchor="middle">发送到设备</text>

  <rect class="row" x="58" y="696" width="754" height="30" rx="6"/>
  <text class="head" x="76" y="717">7 状态栏</text>
  <text class="small" x="242" y="717">在线设备 2 · 传输 1 · 当前输入目标：无</text>

  <rect class="note" x="866" y="134" width="290" height="194" rx="10"/>
  <text class="head" x="890" y="166">两个范围互不绑定</text>
  <text class="body" x="890" y="197">设备范围：</text><text class="small" x="984" y="197">全部 / 某台设备</text>
  <text class="body" x="890" y="225">会话范围：</text><text class="small" x="984" y="225">当前 / 全部 Agent</text>
  <text class="body" x="890" y="264">执行动作：</text><text class="small" x="984" y="264">必须有明确位置</text>
  <text class="small" x="890" y="299">没有明确会话副本时先要求选择，不能静默猜测。</text>

  <rect class="window" x="866" y="366" width="290" height="310" rx="12"/>
  <rect x="866" y="366" width="290" height="36" rx="12" fill="#222"/>
  <text class="white" x="1011" y="389" font-family="sans-serif" font-size="13" text-anchor="middle">独立远程控制窗口</text>
  <rect class="control" x="886" y="422" width="118" height="90" rx="6"/>
  <text class="small" x="945" y="458" text-anchor="middle">Mac Studio</text>
  <text class="small" x="945" y="480" text-anchor="middle">当前输入目标</text>
  <rect x="883" y="419" width="124" height="96" rx="8" fill="none" stroke="#222" stroke-width="3"/>
  <rect class="control" x="1018" y="422" width="118" height="90" rx="6"/>
  <text class="small" x="1077" y="458" text-anchor="middle">Windows</text>
  <text class="small" x="1077" y="480" text-anchor="middle">仅查看</text>
  <rect class="control" x="886" y="540" width="78" height="30" rx="6"/><text class="small" x="925" y="560" text-anchor="middle">暂停输入</text>
  <rect class="control" x="976" y="540" width="72" height="30" rx="6"/><text class="small" x="1012" y="560" text-anchor="middle">断开</text>
  <rect class="control" x="1060" y="540" width="76" height="30" rx="6"/><text class="small" x="1098" y="560" text-anchor="middle">全部停止</text>
  <text class="small" x="886" y="612">多台画面可同时显示；</text>
  <text class="small" x="886" y="634">同一时间只有一台接收键盘鼠标。</text>
  <path class="dash" d="M828 365H858"/><path class="dash" d="M828 552H858"/>
</svg>
