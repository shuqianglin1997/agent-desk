  publish-release:
    needs:
      - release-policy
      - create-draft
      - verify-draft-macos
      - verify-draft-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview-release
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.publish.outputs.release_id }}
      asset_identity: ${{ steps.publish.outputs.asset_identity }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-policy.outputs.tag }}
      EXPECTED_COMMIT_SHA: ${{ needs.release-policy.outputs.commit_sha }}
      RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
      EXPECTED_ASSET_IDENTITY: ${{ needs.create-draft.outputs.asset_identity }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-policy.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Revalidate protected Preview tag identity before publication
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo '::error::The protected Preview tag was not present in the full checkout.'
            exit 1
          fi
          actual_commit_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT_SHA" ] ||
             [ "$actual_commit_sha" != "$EXPECTED_COMMIT_SHA" ]; then
            echo '::error::The protected Preview tag moved after native Draft verification.'
            exit 1
          fi

      - name: Publish only the doubly re-downloaded draft
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '[.tag_name, .draft, .prerelease, ([.assets[].name] | sort | join("|"))] | @tsv')"
          expected_assets="${{ needs.release-policy.outputs.dmg_name }}|${{ needs.release-policy.outputs.portable_name }}|SHA256SUMS.txt"
          expected_assets="$(printf '%s' "$expected_assets" | tr '|' '\n' | LC_ALL=C sort | paste -sd '|' -)"
          expected_state="$(printf '%s\ttrue\ttrue\t%s' "$RELEASE_TAG" "$expected_assets")"
          if [ "$state" != "$expected_state" ]; then
            echo '::error::Draft state or exact asset allowlist changed after native preverification.'
            exit 1
          fi
          actual_asset_identity="$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '[.assets[] | [.name, (.id | tostring), (.size | tostring), .state] | join(":")] | sort | join("|")')"
          if [ "$actual_asset_identity" != "$EXPECTED_ASSET_IDENTITY" ]; then
            echo '::error::A draft asset id, byte size, or upload state changed after native preverification.'
            exit 1
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -F draft=false -F prerelease=true >/dev/null
          printf 'release_id=%s\n' "$RELEASE_ID" >> "$GITHUB_OUTPUT"
          printf 'asset_identity=%s\n' "$EXPECTED_ASSET_IDENTITY" >> "$GITHUB_OUTPUT"

