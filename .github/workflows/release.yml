        shell: pwsh
        run: |
          $actual = (Get-FileHash -LiteralPath "$env:DOWNLOAD_DIR\$env:PORTABLE_NAME" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $env:EXPECTED_WINDOWS_SHA256) {
            throw 'The anonymous public portable changed during packaged smoke.'
          }

      - name: Upload public Windows diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-windows-release-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}\agentdesk-release-diagnostics\public-windows

  redraft-on-public-metadata-failure:
    needs:
      - release-policy
      - create-draft
      - publish-release
      - verify-public-metadata
    if: >-
      ${{
        always() &&
        needs.publish-release.result == 'success' &&
        needs.verify-public-metadata.result != 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-policy.outputs.tag }}
      RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
      EXPECTED_ASSET_IDENTITY: ${{ needs.create-draft.outputs.asset_identity }}
      PUBLICLY_EXPOSED: "true"
      ROLLBACK_TRIGGER: verify-public-metadata failed or was cancelled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-policy.outputs.commit_sha }}
          persist-credentials: false

      - name: Immediately return the failed public candidate to Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/redraft-github-release.sh

      - name: Keep the public metadata watcher failed after rollback
        shell: bash
        run: exit 1

  redraft-on-public-macos-failure:
    needs:
      - release-policy
      - create-draft
      - publish-release
      - verify-public-macos
    if: >-
      ${{
        always() &&
        needs.publish-release.result == 'success' &&
        needs.verify-public-macos.result != 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-policy.outputs.tag }}
      RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
      EXPECTED_ASSET_IDENTITY: ${{ needs.create-draft.outputs.asset_identity }}
      PUBLICLY_EXPOSED: "true"
      ROLLBACK_TRIGGER: verify-public-macos failed or was cancelled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-policy.outputs.commit_sha }}
          persist-credentials: false

      - name: Immediately return the failed public candidate to Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/redraft-github-release.sh

      - name: Keep the public macOS watcher failed after rollback
        shell: bash
        run: exit 1

  redraft-on-public-windows-failure:
    needs:
      - release-policy
      - create-draft
      - publish-release
      - verify-public-windows
    if: >-
      ${{
        always() &&
        needs.publish-release.result == 'success' &&
        needs.verify-public-windows.result != 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-policy.outputs.tag }}
      RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
      EXPECTED_ASSET_IDENTITY: ${{ needs.create-draft.outputs.asset_identity }}
      PUBLICLY_EXPOSED: "true"
      ROLLBACK_TRIGGER: verify-public-windows failed or was cancelled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-policy.outputs.commit_sha }}
          persist-credentials: false

      - name: Immediately return the failed public candidate to Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/redraft-github-release.sh

      - name: Keep the public Windows watcher failed after rollback
        shell: bash
        run: exit 1

  seal-public-release:
    needs:
      - release-policy
      - publish-release
      - verify-public-metadata
      - verify-public-macos
      - verify-public-windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.release-policy.outputs.tag }}
      VERSION: ${{ needs.release-policy.outputs.version }}
      EXPECTED_COMMIT_SHA: ${{ needs.release-policy.outputs.commit_sha }}
      EXPECTED_RELEASE_ID: ${{ needs.publish-release.outputs.release_id }}
      EXPECTED_ASSET_IDENTITY: ${{ needs.publish-release.outputs.asset_identity }}
      DIAGNOSTICS_DIR: ${{ runner.temp }}/agentdesk-release-diagnostics/public-seal
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      RELEASE_GATE_TOKEN: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-policy.outputs.commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Revalidate protected Preview tag identity before final seal
        shell: bash
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo '::error::The protected Preview tag was not present in the full checkout.'
            exit 1
          fi
          actual_commit_sha="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_COMMIT_SHA" ] ||
             [ "$actual_commit_sha" != "$EXPECTED_COMMIT_SHA" ]; then
            echo '::error::The protected Preview tag moved before the final public seal.'
            exit 1
          fi

      - name: Final anonymous metadata read-back
        run: >-
          node scripts/github-release-gate.js
          --mode public
          --repository "${{ github.repository }}"
          --tag "$RELEASE_TAG"
          --version "$VERSION"
          --release-id "$EXPECTED_RELEASE_ID"
          --asset-identity "$EXPECTED_ASSET_IDENTITY"
          --artifact none
          --report "$DIAGNOSTICS_DIR/gate.json"

      - name: Record hosted-runner release seal
        shell: bash
        run: |
          {
            echo '## Public Preview release gate passed'
            echo
            echo '- Exact public asset allowlist: passed'
            echo '- Pre-publication / SHA256SUMS / downloaded-byte hash agreement: passed on macOS and Windows'
            echo '- Native signature, package-integrity, first-use, and two-restart smoke: passed'
            echo '- This is GitHub-hosted-runner evidence only. Browser quarantine, SmartScreen reputation, and clean physical-machine gates remain open.'
          } >> "$GITHUB_STEP_SUMMARY"

  redraft-on-release-failure:
    needs:
      - release-policy
      - create-draft
      - verify-draft-macos
      - verify-draft-windows
      - publish-release
      - verify-public-metadata
      - verify-public-macos
      - verify-public-windows
      - seal-public-release
    if: >-
      ${{
        always() &&
        needs.create-draft.result == 'success' &&
        (
          needs.verify-draft-macos.result != 'success' ||
          needs.verify-draft-windows.result != 'success' ||
          needs.publish-release.result != 'success' ||
          needs.verify-public-metadata.result != 'success' ||
          needs.verify-public-macos.result != 'success' ||
          needs.verify-public-windows.result != 'success' ||
          needs.seal-public-release.result != 'success'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.release-policy.outputs.tag }}
      RELEASE_ID: ${{ needs.create-draft.outputs.release_id }}
      EXPECTED_ASSET_IDENTITY: ${{ needs.create-draft.outputs.asset_identity }}
      PUBLICLY_EXPOSED: ${{ needs.publish-release.result == 'success' }}
      ROLLBACK_TRIGGER: final release-transaction fallback
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-policy.outputs.commit_sha }}
          persist-credentials: false

      - name: Fail closed by returning any exposed release to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/redraft-github-release.sh

      - name: Keep the release workflow failed after rollback
        shell: bash
        run: exit 1
