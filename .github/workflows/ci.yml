name: macOS checks
on:
  push:
    branches: [main, new-version]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test
        run: swift test
      - name: Validate scripts and build release app
        env:
          AGENTDESK_NATIVE_CONFIGURATION: release
        run: |
          bash -n script/build_and_run.sh script/package-release.sh
          ./script/build_and_run.sh --build
