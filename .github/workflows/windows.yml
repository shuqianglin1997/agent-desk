name: Windows checks
on:
  workflow_dispatch:
  push:
    branches: [main, new-version]
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', 'shared/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  test-and-publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - run: windows/script/build.ps1 -Action Test
      - run: windows/script/build.ps1 -Action Publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AgentDeskNative-Windows-preview
          path: dist.noindex/windows/AgentDeskNative
