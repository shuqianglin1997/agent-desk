name: macOS checks
on:
  workflow_dispatch:
  push:
    branches: [main, new-version]
    paths: ["macos/**", "shared/**", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["macos/**", "shared/**", ".github/workflows/macos.yml"]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test
        run: swift test --package-path macos
      - name: Validate scripts and build release app
        env:
          AGENTDESK_NATIVE_CONFIGURATION: release
        run: |
          bash -n macos/script/build_and_run.sh macos/script/package-release.sh
          ./macos/script/build_and_run.sh --build
