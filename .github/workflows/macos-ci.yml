name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      # This ad-hoc-signed unpacked build is a CI compatibility check only.
      # Production DMGs are created exclusively by release.yml with Developer
      # ID signing and notarization.
      - name: Build unpacked macOS app
        run: npm run build:mac:dir
